[package]
name = "reqwest"
version = "0.12.0"
edition = "2021"
description = "wasip2-compatible shim providing reqwest's API surface backed by wasi:http"

[lib]
name = "reqwest"
path = "src/lib.rs"

[features]
default = []
# Feature flags that Codex enables — accepted but no-op in the shim
json = []
multipart = []
rustls-tls = []
rustls-tls-native-roots = []
stream = []
cookies = []
gzip = []

[dependencies]
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bytes = "1"
futures-core = { version = "0.3", default-features = false }
