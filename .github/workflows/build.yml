name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Build and Test
    runs-on: [self-hosted, linux, x64, proxmox]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: git submodule update --init stripe-cli-wasm/stripe-cli

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt

      - name: Install Cargo tools
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --log-level info cargo-component wit-deps-cli wasm-tools

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Moon 2.x deadlocks on self-hosted LXC runners due to a pidfd/zombie
      # reaping bug in its SetupEnvironment action. Bypass Moon entirely and
      # run the build pipeline directly. Order matches Moon's dependency graph.
      - name: Fetch WIT dependencies
        working-directory: runtime
        run: wit-deps update

      - name: Check formatting
        working-directory: runtime
        run: cargo fmt --all --check

      - name: Cargo check
        working-directory: runtime
        run: cargo check --workspace --exclude wasmtime-runner

      - name: Build WASM components
        working-directory: runtime
        run: |
          cargo component build --release --target wasm32-wasip2 \
            -p ts-runtime-mcp -p tsx-engine -p sqlite-module -p ratatui-demo \
            -p edtui-module -p stripe-module -p web-agent-tui -p web-headless-agent
          cargo fmt --all

      - name: Verify WASM outputs
        run: |
          for f in ts_runtime_mcp tsx_engine sqlite_module ratatui_demo \
                   edtui_module stripe_module web_agent_tui web_headless_agent; do
            test -f "target/wasm32-wasip2/release/${f}.wasm" || \
            test -f "target/wasm32-wasip1/release/${f}.wasm" || \
              { echo "Missing: ${f}.wasm"; exit 1; }
          done
          echo "All WASM components verified"

      - name: Build Go WASM (stripe-cli)
        working-directory: stripe-cli-wasm
        run: |
          cd stripe-cli && GOOS=wasip1 GOARCH=wasm go build -o ../stripe.wasm ./cmd/stripe
          cd ..
          wasm-tools component embed wit/ --world stripe:cli/stripe-cli stripe.wasm -o stripe-embedded.wasm
          wasm-tools component new stripe-embedded.wasm --adapt wasi_snapshot_preview1=adapters/wasi_snapshot_preview1.command.wasm -o stripe-component.wasm
          mkdir -p ../target/wasm32-wasip2/release
          cp stripe-component.wasm ../target/wasm32-wasip2/release/stripe_go.wasm

      - name: Check native (wasmtime-runner)
        working-directory: runtime
        run: cargo check -p wasmtime-runner

      - name: Run Rust tests
        working-directory: runtime
        run: cargo test --features sqlite

      - name: Transpile WASM to JS
        run: |
          node scripts/transpile.mjs
          node scripts/transpile.mjs --sync

      - name: Build packages and frontend
        run: pnpm -r --filter '!frontend' run build && pnpm --filter frontend run build

      - name: Copy externals
        working-directory: frontend
        run: |
          mkdir -p dist/wasi-shims && cp ../packages/wasi-shims/browser-dist/*.js ../packages/wasi-shims/browser-dist/*.js.map dist/wasi-shims/ 2>/dev/null; cp ../packages/wasi-shims/dist/error.js ../packages/wasi-shims/dist/random.js dist/wasi-shims/ 2>/dev/null || true
          mkdir -p dist/wasm-loader && cp ../packages/wasm-loader/dist/*.js ../packages/wasm-loader/dist/*.js.map dist/wasm-loader/ 2>/dev/null || true

      - name: Run frontend tests
        run: pnpm --filter frontend test

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: E2E Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(cd frontend && npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}
        timeout-minutes: 10

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

  website:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
