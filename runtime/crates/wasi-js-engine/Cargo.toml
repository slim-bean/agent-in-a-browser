[package]
name = "wasi-js-engine"
version.workspace = true
edition.workspace = true

[dependencies]
rquickjs = { git = "https://github.com/DelSkayn/rquickjs.git", rev = "3a86441", features = [
    "futures",
    "classes",
    "macro",
    "bindgen",
    "parallel",
] }
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
