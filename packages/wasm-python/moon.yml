$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  build:
    deps:
      - "wasm-loader:build"

  copy-pyodide:
    command: "node ../../scripts/copy-pyodide.mjs"
    inputs:
      - "/scripts/copy-pyodide.mjs"
      - "/packages/wasm-python/package.json"
      - "/pyodide/dist/**"
    outputs:
      - "/frontend/public/pyodide"
