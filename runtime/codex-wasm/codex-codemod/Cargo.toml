[package]
name = "codex-codemod"
version = "0.1.0"
edition = "2021"
description = "Automated codemod tool for transforming Codex upstream code for wasip2 compatibility"

[[bin]]
name = "codex-codemod"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "visit", "visit-mut", "parsing", "printing"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
toml_edit = "0.22"
regex-lite = "0.1"
walkdir = "2"
console-log = { path = "../../crates/console-log" }
ra_ap_hir = "0.0.327"
ra_ap_ide = "0.0.327"
ra_ap_ide_db = "0.0.327"
ra_ap_load-cargo = "0.0.327"
ra_ap_paths = "0.0.327"
ra_ap_project_model = "0.0.327"
ra_ap_syntax = "0.0.327"
ra_ap_vfs = "0.0.327"

[dev-dependencies]
tempfile = "3"
