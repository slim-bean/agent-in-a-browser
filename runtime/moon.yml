$schema: "https://moonrepo.dev/schemas/project.json"

language: rust
layer: library
tags: ["rust"]

workspace:
  inheritedTasks:
    exclude: ["build"]

fileGroups:
  rust-sources:
    - "src/**"
    - "crates/*/src/**"
  cargo-configs:
    - "Cargo.toml"
    - "crates/*/Cargo.toml"
    - "/Cargo.toml"
    - "/Cargo.lock"
  wit-files:
    - "wit/**"
    - "crates/*/wit/**"

tasks:
  wit-deps:
    command: "wit-deps update"
    inputs:
      - "wit/deps.toml"
    outputs:
      - "wit/deps/cli"
      - "wit/deps/clocks"
      - "wit/deps/filesystem"
      - "wit/deps/http"
      - "wit/deps/io"
      - "wit/deps/random"
      - "wit/deps/sockets"
    options:
      # WIT deps are committed to the repo; this task is a local convenience.
      # GitHub tarballs have unstable hashes across CDN nodes, causing
      # hash mismatches in CI. "skip" lets downstream tasks declare deps
      # on wit-deps for local ordering without triggering it in CI.
      runInCI: "skip"

  build-wasm:
    script: "cargo component build --release --target wasm32-wasip2 -p ts-runtime-mcp -p tsx-engine -p sqlite-module -p edtui-module -p stripe-module && cargo fmt --all"
    env:
      # WASI_SDK_PATH must be inherited from the process environment.
      # Set locally (e.g. export WASI_SDK_PATH=~/.local/wasi-sdk-32.0-x86_64-linux)
      # or via CI ($GITHUB_ENV in .github/workflows/build.yml).
      # Explicit passthrough ensures Moon doesn't shadow it.
      WASI_SDK_PATH: "${WASI_SDK_PATH}"
      CC_wasm32_wasip1: "${WASI_SDK_PATH}/bin/clang"
      CC_wasm32_wasip2: "${WASI_SDK_PATH}/bin/clang"
      CFLAGS_wasm32_wasip1: "--sysroot=${WASI_SDK_PATH}/share/wasi-sysroot"
      # libsqlite3-sys build.rs only checks TARGET=="wasm32-wasi" (exact match),
      # missing wasm32-wasip2. Pass the same flags it would set for wasm32-wasi:
      # THREADSAFE=0 avoids pthread mutex calls; LONGDOUBLE_TYPE=double because
      # WASM has no long double; _WASI_EMULATED_* enables emulated POSIX APIs.
      # unix-none VFS bypasses fcntl locking (ENOSYS on WASI); the OPFS
      # SyncAccessHandle provides implicit exclusive access instead.
      CFLAGS_wasm32_wasip2: "-DSQLITE_THREADSAFE=0 -DLONGDOUBLE_TYPE=double -D_WASI_EMULATED_MMAN -D_WASI_EMULATED_GETPID -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS -DSQLITE_DEFAULT_UNIX_VFS=\"unix-none\" --sysroot=${WASI_SDK_PATH}/share/wasi-sysroot"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
      - "@group(wit-files)"
    outputs:
      - "/target/wasm32-wasip2/release/ts_runtime_mcp.wasm"
      - "/target/wasm32-wasip2/release/tsx_engine.wasm"
      - "/target/wasm32-wasip2/release/sqlite_module.wasm"
      - "/target/wasm32-wasip2/release/edtui_module.wasm"
      - "/target/wasm32-wasip2/release/stripe_module.wasm"
    deps:
      - "~:wit-deps"
    options:
      runInCI: true

  # The codex-upstream submodule carries our patches pre-applied.
  # After rebasing against upstream, run: cargo run -p codex-codemod -- codex-upstream
  # then commit the result in the submodule fork.
  build-codex-tui:
    script: |
      git submodule update --init codex-upstream &&
      cargo component build --manifest-path codex-wasm/codex-wasm-tui/Cargo.toml --release --target wasm32-wasip2 &&
      cp codex-wasm/codex-wasm-tui/target/wasm32-wasip2/release/codex_wasm_tui.wasm ../target/wasm32-wasip2/release/codex_wasm_tui.wasm
    inputs:
      - "codex-upstream/codex-rs/**"
      - "codex-wasm/codex-wasm-tui/src/**"
      - "codex-wasm/codex-wasm-tui/wit/**"
      - "codex-wasm/codex-wasm-tui/Cargo.toml"
      - "codex-wasm/wasi-tokio/src/**"
      - "codex-wasm/wasi-reqwest/src/**"
      - "codex-wasm/wasi-crossterm/src/**"
      - "codex-wasm/wasi-tokio-util/src/**"
      - "codex-wasm/wasi-codex-login/src/**"
      - "codex-wasm/wasi-codex-otel/src/**"
      - "codex-wasm/platform-traits/src/**"
    outputs:
      - "/target/wasm32-wasip2/release/codex_wasm_tui.wasm"
    deps:
      - "~:wit-deps"

  verify-wasm:
    command: "wasm-tools component wit ../target/wasm32-wasip2/release/ts_runtime_mcp.wasm"
    deps:
      - "~:build-wasm"
    options:
      cache: false
      runInCI: true

  fmt-check:
    command: "cargo fmt --all --check"
    inputs:
      - "src/**/*.rs"
      - "crates/*/src/**/*.rs"
    deps:
      - "~:build-wasm"
    options:
      runInCI: true
      cache: false

  check:
    command: "cargo check --workspace --all-targets --exclude wasmtime-runner"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
      - "@group(wit-files)"
    deps:
      - "~:wit-deps"
    options:
      runInCI: true

  check-native:
    command: "cargo check -p wasmtime-runner"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
    deps:
      - "~:build-wasm"
    options:
      runInCI: true

  test:
    command: "cargo test --features sqlite"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
    options:
      runInCI: true

