$schema: "https://moonrepo.dev/schemas/project.json"

language: rust
layer: library
tags: ["rust"]

workspace:
  inheritedTasks:
    exclude: ["build"]

fileGroups:
  rust-sources:
    - "src/**"
    - "crates/*/src/**"
  cargo-configs:
    - "Cargo.toml"
    - "crates/*/Cargo.toml"
    - "/Cargo.toml"
    - "/Cargo.lock"
  wit-files:
    - "wit/**"
    - "crates/*/wit/**"

tasks:
  wit-deps:
    command: "wit-deps update"
    inputs:
      - "wit/deps.toml"
    outputs:
      - "wit/deps/cli"
      - "wit/deps/clocks"
      - "wit/deps/filesystem"
      - "wit/deps/http"
      - "wit/deps/io"
      - "wit/deps/random"
      - "wit/deps/sockets"
    options:
      runInCI: true

  build-wasm:
    script: "cargo component build -v --release --target wasm32-wasip2 -p ts-runtime-mcp -p tsx-engine -p sqlite-module -p ratatui-demo -p edtui-module -p stripe-module -p web-agent-tui -p web-headless-agent && cargo fmt --all"
    env:
      # libsqlite3-sys (bundled) needs a C cross-compiler targeting WASI.
      # WASI_SDK_PATH must point to the wasi-sdk installation root.
      # Set locally (e.g. export WASI_SDK_PATH=~/.local/wasi-sdk-32.0-arm64-macos)
      # or via CI (see .github/workflows/build.yml).
      CC_wasm32_wasip1: "${WASI_SDK_PATH}/bin/clang"
      CC_wasm32_wasip2: "${WASI_SDK_PATH}/bin/clang"
      CFLAGS_wasm32_wasip1: "--sysroot=${WASI_SDK_PATH}/share/wasi-sysroot"
      # libsqlite3-sys build.rs only checks TARGET=="wasm32-wasi" (exact match),
      # missing wasm32-wasip2. Pass the same flags it would set for wasm32-wasi:
      # THREADSAFE=0 avoids pthread mutex calls; LONGDOUBLE_TYPE=double because
      # WASM has no long double; _WASI_EMULATED_* enables emulated POSIX APIs.
      # unix-none VFS bypasses fcntl locking (ENOSYS on WASI); the OPFS
      # SyncAccessHandle provides implicit exclusive access instead.
      CFLAGS_wasm32_wasip2: "-DSQLITE_THREADSAFE=0 -DLONGDOUBLE_TYPE=double -D_WASI_EMULATED_MMAN -D_WASI_EMULATED_GETPID -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS -DSQLITE_DEFAULT_UNIX_VFS=\"unix-none\" --sysroot=${WASI_SDK_PATH}/share/wasi-sysroot"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
      - "@group(wit-files)"
    outputs:
      - "/target/wasm32-wasip2/release/ts_runtime_mcp.wasm"
      - "/target/wasm32-wasip2/release/tsx_engine.wasm"
      - "/target/wasm32-wasip2/release/sqlite_module.wasm"
      - "/target/wasm32-wasip2/release/ratatui_demo.wasm"
      - "/target/wasm32-wasip2/release/edtui_module.wasm"
      - "/target/wasm32-wasip2/release/stripe_module.wasm"
      - "/target/wasm32-wasip2/release/web_agent_tui.wasm"
      - "/target/wasm32-wasip2/release/web_headless_agent.wasm"
    deps:
      - "~:wit-deps"
    options:
      runInCI: true

  verify-wasm:
    command: "wasm-tools component wit ../target/wasm32-wasip2/release/ts_runtime_mcp.wasm"
    deps:
      - "~:build-wasm"
    options:
      cache: false
      runInCI: true

  fmt-check:
    command: "cargo fmt --all --check"
    inputs:
      - "src/**/*.rs"
      - "crates/*/src/**/*.rs"
    deps:
      - "~:build-wasm"
    options:
      runInCI: true
      cache: false

  check:
    command: "cargo check --workspace --all-targets --exclude wasmtime-runner"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
      - "@group(wit-files)"
    deps:
      - "~:wit-deps"
    options:
      runInCI: true

  check-native:
    command: "cargo check -p wasmtime-runner"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
    deps:
      - "~:build-wasm"
    options:
      runInCI: true

  test:
    command: "cargo test --features sqlite"
    inputs:
      - "@group(rust-sources)"
      - "@group(cargo-configs)"
    options:
      runInCI: true

  transpile-ios:
    command: "node ../scripts/transpile.mjs web-headless-agent-ios"
    inputs:
      - "/target/wasm32-wasip2/release/web_headless_agent.wasm"
      - "/scripts/transpile.mjs"
    deps:
      - "~:build-wasm"
    options:
      runInCI: false
