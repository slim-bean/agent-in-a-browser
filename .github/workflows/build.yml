name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Build and Test
    runs-on: [self-hosted, linux, x64, proxmox]

    steps:
      - name: Clean stale submodule metadata
        run: |
          rm -rf .git/modules/stripe-cli-wasm 2>/dev/null || true
          rm -rf .git/modules/stripe-cli-wasm/stripe-cli 2>/dev/null || true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule deinit --all -f 2>/dev/null || true
          git submodule update --init --force stripe-cli-wasm git-cli-wasm/patches/go-git runtime/codex-upstream tree-sitter-wasm/tree-sitter tree-sitter-wasm/tree-sitter-bash

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          channel: "stable"
          targets: wasm32-wasip2,wasm32-wasip1
          components: rustfmt
          cache: false

      - name: Install Cargo tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --log-level info cargo-component wit-deps-cli wasm-tools

      - name: Install wasi-sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WASI_SDK_VERSION=32
          gh release download "wasi-sdk-${WASI_SDK_VERSION}" \
            --repo WebAssembly/wasi-sdk \
            --pattern "wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            --dir /tmp --clobber
          mkdir -p "$HOME/.local"
          tar xzf /tmp/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz -C "$HOME/.local/"
          echo "WASI_SDK_PATH=$HOME/.local/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> $GITHUB_ENV

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
        env:
          GOTOOLCHAIN: auto

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Moon 2.x uses tokio which relies on pidfd_open() for child process
      # monitoring on Linux. In containerized CI (GitHub Actions, LXC), the
      # pidfd epoll notification never fires, causing Moon to hang forever.
      # This LD_PRELOAD shim intercepts pidfd_open() and returns ENOSYS,
      # forcing tokio to fall back to reliable SIGCHLD-based reaping.
      - name: Build pidfd workaround
        run: gcc -shared -fPIC -o /tmp/no_pidfd.so scripts/no_pidfd.c -ldl

      - name: Clean Rust target and Moon cache (avoid stale cache)
        run: |
          cd runtime && cargo clean
          rm -rf ../.moon/cache 2>/dev/null || true

      - name: Apply tree-sitter WASM codemod
        run: |
          cd tree-sitter-wasm/codemod
          cargo run --release -- $GITHUB_WORKSPACE/tree-sitter-wasm

      - name: Build stripe-cli WASM
        run: |
          cd stripe-cli-wasm
          GOTOOLCHAIN=auto GOOS=wasip1 GOARCH=wasm go build -o bin/stripe.wasm ./cmd/stripe
          wasm-tools component embed wasm/wit/ --world stripe:cli/stripe-cli bin/stripe.wasm -o bin/stripe-embedded.wasm
          wasm-tools component new bin/stripe-embedded.wasm --adapt wasi_snapshot_preview1=wasm/adapters/wasi_snapshot_preview1.command.wasm -o bin/stripe-component.wasm
          mkdir -p ../target/wasm32-wasip2/release
          cp bin/stripe-component.wasm ../target/wasm32-wasip2/release/stripe_go.wasm
          cd wasm/npm && pnpm install && pnpm build

      - name: Moon CI
        env:
          LD_PRELOAD: /tmp/no_pidfd.so
          MOON_TOOLCHAIN_FORCE_GLOBALS: "true"
        run: |
          pnpm exec moon run \
            runtime:fmt-check \
            runtime:check \
            runtime:build-wasm \
            runtime:verify-wasm \
            runtime:check-native \
            runtime:test \
            git-cli-wasm:build-go-wasm \
            git-cli-wasm:adapt-component \
            git-cli-wasm:copy-to-target \
            frontend:build \
            frontend:copy-externals \
            frontend:test

      # IMPORTANT: Artifact upload must happen BEFORE the R2 offload step.
      # The offload script deletes .wasm files from dist/ after uploading them
      # to R2. E2E tests (which download this artifact) need those .wasm files
      # because they use `vite preview` with no Worker to redirect to the CDN.
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          include-hidden-files: true
          retention-days: 7

      # Upload all WASM assets to R2 at builds/{sha}/... paths.
      # This includes both Vite-bundled .wasm from dist/ and stripe.wasm
      # (built separately by Go). The script deletes dist .wasm files after
      # upload — they're no longer needed here since the artifact is already saved.
      - name: Upload WASM assets to R2 CDN
        run: node scripts/offload-r2-assets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_ID: ${{ github.sha }}

  e2e:
    name: E2E Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(cd frontend && npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: frontend
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}
        timeout-minutes: 10

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

  website:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
