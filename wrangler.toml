name = "agent-in-a-browser"
main = "worker/src/index.ts"
compatibility_date = "2025-12-22"
workers_dev = false
account_id = "687f8b8c824af34922f7bb4d1776f1a7"

# Custom Domain - Cloudflare automatically manages DNS and certificates
# Session subdomains ({sid}.{tenantId}.sessions.edge-agent.dev) are routed
# via CF for SaaS Custom Hostnames — no extra route entries needed here.
routes = [
    { pattern = "agent.edge-agent.dev", custom_domain = true },
]

# Static assets configuration - serve from frontend/dist
# run_worker_first = true ensures Worker code runs for ALL requests
# This is required for the Worker to add COOP/COEP headers for SharedArrayBuffer
[assets]
directory = "frontend/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = true

# SessionRelay Durable Object — one instance per session
[durable_objects]
bindings = [
    { name = "SESSION_RELAY", class_name = "SessionRelay" }
]

# Cloudflare free plan requires new_sqlite_classes (not new_classes) for
# Durable Objects. This uses SQLite-backed storage which is the only option
# available on free plans as of 2026.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRelay"]

# KV namespace for API key storage (deployer auth)
# Create with: wrangler kv:namespace create API_KEYS
# Then update the id below
[[kv_namespaces]]
binding = "API_KEYS"
id = "2b0dabb7574f4bfb95aea34b7ec539d4"
preview_id = "2322559f992941ba989985ae3acc4806"

# WASM CDN asset versioning.
#
# All .wasm files are too large for Workers static assets (25 MiB limit) and
# live on R2 instead (cdn.edge-agent.dev). The Worker redirects *.wasm requests
# to cdn.edge-agent.dev/builds/{BUILD_ID}/... so each deploy gets a unique,
# immutably-cached namespace. See worker/src/index.ts `redirectToCdn()`.
#
# In CI, deploy-pages.yml overrides this with `--var BUILD_ID:{github.sha}`.
# The matching R2 upload happens in build.yml via scripts/offload-r2-assets.mjs.
# Local dev uses "dev" — upload assets with `BUILD_ID=dev node scripts/offload-r2-assets.mjs`.
[vars]
BUILD_ID = "dev"

# Observability configuration for better logging
[observability]
enabled = true
head_sampling_rate = 1.0
