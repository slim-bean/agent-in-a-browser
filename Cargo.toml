[workspace]
members = [
    "runtime",
    "runtime/runtime-macros",
    "runtime/crates/tsx-engine",
    "runtime/crates/sqlite-module",
    "runtime/crates/mcp-server-core",
    "runtime/crates/edtui-module",
    "runtime/crates/console-log",
    "runtime/crates/stripe-module",
    "runtime/crates/wasmtime-runner",
    # Codex WASM fork — shim crates and tooling
    "runtime/codex-wasm/platform-traits",
    "runtime/codex-wasm/wasi-tokio",
    "runtime/codex-wasm/wasi-tokio-macros",
    "runtime/codex-wasm/wasi-reqwest",
    "runtime/codex-wasm/wasi-tokio-util",
    "runtime/codex-wasm/wasi-crossterm",
    "runtime/codex-wasm/wasi-codex-otel",
    # wasi-codex-login removed — upstream codex-login now compiles directly
    "runtime/codex-wasm/codex-codemod",
]
exclude = [
    # codex-wasm-tui depends on codex-upstream crates which require
    # the codemod to be applied first. It is built separately after
    # the codemod runs: cargo component build -p codex-wasm-tui
    "runtime/codex-wasm/codex-wasm-tui",
    # wasi-webbrowser is consumed by codex-wasm-tui via [patch.crates-io],
    # not as a workspace member (its package name is "webbrowser" to match
    # the crate it replaces).
    "runtime/codex-wasm/wasi-webbrowser",
    "runtime/codex-wasm/wasi-os-info",
    "runtime/codex-wasm/wasi-tiny-http",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Web Agent Contributors"]
license = "MIT"

# Centralize wit-bindgen versions to ensure all crates produce compatible WASI interfaces.
# wit-bindgen 0.51 produces WASI 0.2.9 interfaces which must match wasi-shims Symbol markers.
# Note: wit-bindgen-rt has a separate versioning scheme from wit-bindgen
[workspace.dependencies]
wit-bindgen = { version = "0.53", features = ["async", "async-spawn"] }
wit-bindgen-rt = { version = "0.44", features = ["async", "bitflags"] }

[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Better optimization
debug = true      # Debug info for browser profiling
