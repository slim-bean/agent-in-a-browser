[package]
name = "codex-login"
version = "0.0.0"
edition = "2024"
description = "Stub for codex-login in wasip2 — auth types with no-op implementations"

[lib]
name = "codex_login"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.9"
reqwest = { path = "../wasi-reqwest" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { path = "../wasi-tokio" }
codex-protocol = { path = "../../codex-upstream/codex-rs/protocol" }
codex-app-server-protocol = { path = "../../codex-upstream/codex-rs/app-server-protocol" }
codex-config = { path = "../../codex-upstream/codex-rs/config" }
