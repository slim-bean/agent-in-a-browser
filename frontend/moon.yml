$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  transpile:
    command: "node ../scripts/transpile.mjs codex-wasm-tui"
    inputs:
      - "/target/wasm32-wasip2/release/codex_wasm_tui.wasm"
      - "/scripts/transpile.mjs"
    outputs:
      - "src/wasm/codex-tui"
    deps:
      - "runtime:build-codex-tui"
      - "mcp-wasm-server:transpile"

  transpile-sync:
    command: "node ../scripts/transpile.mjs codex-wasm-tui --sync"
    inputs:
      - "/target/wasm32-wasip2/release/codex_wasm_tui.wasm"
      - "/scripts/transpile.mjs"
    outputs:
      - "src/wasm/codex-tui-sync"
    deps:
      - "runtime:build-codex-tui"
      - "mcp-wasm-server:transpile-sync"

  transpile-app-server:
    command: "node ../scripts/transpile.mjs codex-wasm-app-server"
    deps:
      - "runtime:build-codex-app-server"
    inputs:
      - "/target/wasm32-wasip2/release/codex_wasm_app_server.wasm"
      - "/scripts/transpile.mjs"
    outputs:
      - "src/wasm/codex-app-server"

  transpile-app-server-sync:
    command: "node ../scripts/transpile.mjs codex-wasm-app-server --sync"
    deps:
      - "runtime:build-codex-app-server"
    inputs:
      - "/target/wasm32-wasip2/release/codex_wasm_app_server.wasm"
      - "/scripts/transpile.mjs"
    outputs:
      - "src/wasm/codex-app-server-sync"

  generate-protocol-map:
    command: "node ../scripts/generate-protocol-map.mjs"
    inputs:
      - "/runtime/codex-upstream/codex-rs/app-server-protocol/src/protocol/common.rs"
      - "/runtime/codex-upstream/codex-rs/app-server-protocol/schema/typescript/**"
      - "/scripts/generate-protocol-map.mjs"
    outputs:
      - "src/wasm/app-server/protocol-map.generated.ts"

  copy-pyodide:
    command: "node ../scripts/copy-pyodide.mjs"
    inputs:
      - "/scripts/copy-pyodide.mjs"
      - "/packages/wasm-python/package.json"
      - "/pyodide/dist/**"
    outputs:
      - "public/pyodide"

  build:
    script: "tsc && vite build"
    inputs:
      - "src/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
    outputs:
      - "dist"
    deps:
      - "^:build"
      - "~:copy-pyodide"
      - "~:transpile"
      - "~:transpile-sync"
      - "mcp-wasm-server:transpile"
      - "mcp-wasm-server:transpile-sync"
      - "wasm-tsx:transpile"
      - "wasm-tsx:transpile-sync"
      - "wasm-sqlite:transpile"
      - "wasm-sqlite:transpile-sync"
      - "wasm-vim:transpile"
      - "wasm-vim:transpile-sync"
      - "wasm-git:transpile"
      - "wasm-git:transpile-sync"
      - "~:transpile-app-server"
      - "~:transpile-app-server-sync"
      - "~:generate-protocol-map"

  # Copy non-Vite assets into dist/ that the app expects at runtime.
  # stripe.wasm is included here for local dev (`vite dev`) and E2E tests
  # (`vite preview`) which serve dist/ directly without a Worker to redirect
  # .wasm requests to R2 CDN. In production, the Worker redirects *.wasm to
  # cdn.edge-agent.dev and deploy-pages.yml strips .wasm from dist before deploy.
  copy-externals:
    script: "mkdir -p dist/wasi-shims && cp ../packages/wasi-shims/browser-dist/*.js ../packages/wasi-shims/browser-dist/*.js.map dist/wasi-shims/ 2>/dev/null; cp ../packages/wasi-shims/dist/error.js ../packages/wasi-shims/dist/random.js dist/wasi-shims/ 2>/dev/null || true && mkdir -p dist/wasm-loader && cp ../packages/wasm-loader/dist/*.js ../packages/wasm-loader/dist/*.js.map dist/wasm-loader/ 2>/dev/null || true && mkdir -p dist/wasm-stripe && cp ../stripe-cli-wasm/bin/stripe.wasm dist/wasm-stripe/stripe.wasm 2>/dev/null || true && mkdir -p dist/wasm-git && cp ../git-cli-wasm/git.wasm dist/wasm-git/git.wasm 2>/dev/null || true"
    inputs:
      - "/packages/wasi-shims/browser-dist/**"
      - "/packages/wasi-shims/dist/error.js"
      - "/packages/wasi-shims/dist/random.js"
      - "/packages/wasm-loader/dist/**"
      - "/stripe-cli-wasm/bin/stripe.wasm"
      - "/git-cli-wasm/git.wasm"
    outputs:
      - "dist/wasi-shims"
      - "dist/wasm-loader"
      - "dist/wasm-stripe"
      - "dist/wasm-git"
    deps:
      - "~:build"
      - "wasi-shims:build"
      - "wasm-loader:build"

  test:
    command: "vitest run"
    inputs:
      - "src/**"
      - "tests/**"
    deps:
      - "~:build"

  test-e2e:
    command: "npx playwright test --project=chromium"
    inputs:
      - "e2e/**"
      - "src/**"
    deps:
      - "~:build"
      - "~:copy-externals"
    options:
      cache: false

  dev:
    command: "vite"
    preset: "server"
    options:
      persistent: true
      cache: false
