$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  transpile:
    command: "node ../../scripts/transpile.mjs codex-wasm-agent"
    inputs:
      - "/target/wasm32-wasip2/release/codex_wasm_agent.wasm"
      - "/scripts/transpile.mjs"
    outputs:
      - "src/wasm"
    deps:
      - "runtime:build-codex-wasm"

  transpile-sync:
    command: "node ../../scripts/transpile.mjs codex-wasm-agent --sync"
    inputs:
      - "/target/wasm32-wasip2/release/codex_wasm_agent.wasm"
      - "/scripts/transpile.mjs"
    outputs:
      - "src/wasm-sync"
    deps:
      - "runtime:build-codex-wasm"

  build:
    script: "tsc && cp -r src/wasm dist/"
    inputs:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
    outputs:
      - "dist"
    deps:
      - "~:transpile"
      - "wasi-shims:build"
