[package]
name = "codex-wasm-app-server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Upstream codex crates — app-server client wraps the in-process runtime
codex-app-server-client = { path = "../../codex-upstream/codex-rs/app-server-client" }
codex-app-server-protocol = { path = "../../codex-upstream/codex-rs/app-server-protocol" }
codex-core = { path = "../../codex-upstream/codex-rs/core" }
codex-protocol = { path = "../../codex-upstream/codex-rs/protocol" }
codex-login = { path = "../../codex-upstream/codex-rs/login" }
codex-arg0 = { path = "../../codex-upstream/codex-rs/arg0" }
codex-feedback = { path = "../wasi-codex-feedback" }
codex-exec-server = { path = "../wasi-exec-server" }
codex-keyring-store = { path = "../wasi-keyring-store" }

# WASM shim crates
reqwest = { path = "../wasi-reqwest" }
tokio = { path = "../wasi-tokio" }
async-trait = "0.1"

# Browser host API shims
webbrowser = { path = "../wasi-webbrowser" }
arboard = { path = "../wasi-arboard" }
cpal = { path = "../wasi-cpal" }
tiny_http = { path = "../wasi-tiny-http" }

# Serialization for JSON protocol bridge
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WIT bindings
wit-bindgen = "0.36"
wit-bindgen-rt = "0.36"
console-log = { path = "../../crates/console-log" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Standalone workspace — depends on codex-upstream crates that require the codemod.
[workspace]

# Redirect transitive dependencies to our WASM shims
[patch.crates-io]
crossterm = { path = "../wasi-crossterm" }
tokio = { path = "../wasi-tokio" }
reqwest = { path = "../wasi-reqwest" }
tokio-util = { path = "../wasi-tokio-util" }
arboard = { path = "../wasi-arboard" }
webbrowser = { path = "../wasi-webbrowser" }
cpal = { path = "../wasi-cpal" }
os_info = { path = "../wasi-os-info" }
sqlx = { path = "../wasi-sqlx" }
tiny_http = { path = "../wasi-tiny-http" }
codex-keyring-store = { path = "../wasi-keyring-store" }
codex-terminal-detection = { path = "../wasi-terminal-detection" }
codex-shell-escalation = { path = "../wasi-shell-escalation" }
codex-utils-pty = { path = "../wasi-pty" }
codex-network-proxy = { path = "../wasi-network-proxy" }
codex-exec-server = { path = "../wasi-exec-server" }
codex-rmcp-client = { path = "../wasi-rmcp-client" }
path-absolutize = { path = "../wasi-path-absolutize" }
tokio-tungstenite = { path = "../wasi-tokio-tungstenite" }
tungstenite = { path = "../wasi-tungstenite" }
tokio-stream = { path = "../wasi-tokio-stream" }
codex-utils-oss = { path = "../wasi-codex-utils-oss" }
codex-cloud-requirements = { path = "../wasi-codex-cloud-requirements" }
codex-backend-client = { path = "../wasi-codex-backend-client" }
futures-util = { path = "../patches/futures-util" }
tree-sitter-language = { path = "../../../tree-sitter-wasm/tree-sitter/lib/language" }

[package.metadata.component]
package = "codex:app-server"

[package.metadata.component.target]
path = "wit"
world = "codex-app-server"

[package.metadata.component.target.dependencies]
"wasi:http" = { path = "../../wit/deps/http" }
"wasi:clocks" = { path = "../../wit/deps/clocks" }
"wasi:io" = { path = "../../wit/deps/io" }
"wasi:random" = { path = "../../wit/deps/random" }
"wasi:filesystem" = { path = "../../wit/deps/filesystem" }
"wasi:cli" = { path = "../../wit/deps/cli" }
"wasi:sockets" = { path = "../../wit/deps/sockets" }
"host:browser" = { path = "../../wit/deps/browser" }
"host:console" = { path = "../../wit/deps/console" }
